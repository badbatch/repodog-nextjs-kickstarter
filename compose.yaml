services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KICKSTARTER_SERVER__API__BASE_URL: ${KICKSTARTER_SERVER__API__BASE_URL:-http://host.docker.internal:8080}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: 'true'
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-repodog-nextjs-kickstarter}
      PORT: 3000
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '3000:3000'
